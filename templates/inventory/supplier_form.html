{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="{% url 'inventory:supplier_list' %}" style="text-decoration: none; color: var(--text-muted);">&larr; Back to Suppliers</a>
        <h1 class="page-title" style="margin-top: 0.25rem;">{{ title }}</h1>
    </div>
</div>

<div class="card" style="max-width: 720px; margin: 0 auto;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem;">
                <div class="form-group">
                    <label class="form-label">Contact Person Name *</label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label class="form-label">Company Name</label>
                    {{ form.company_name }}
                </div>
                <div class="form-group">
                    <label class="form-label">Phone *</label>
                    {{ form.phone }}
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    {{ form.email }}
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label class="form-label">Tax ID / GST Number</label>
                    {{ form.tax_id }}
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label class="form-label">Address</label>
                    {{ form.address }}
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label class="form-label">Notes & Terms</label>
                    {{ form.notes }}
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; border-top: 1px solid var(--border-light); padding-top: 1.25rem;">
                <a href="{% url 'inventory:supplier_list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Supplier</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
