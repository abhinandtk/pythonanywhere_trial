{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="{% url 'inventory:category_list' %}" style="text-decoration: none; color: var(--text-muted);">&larr; Back to Categories</a>
        <h1 class="page-title" style="margin-top: 0.25rem;">{{ title }}</h1>
    </div>
</div>

<div class="card" style="max-width: 580px; margin: 0 auto;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Category Name *</label>
                {{ form.name }}
                {% if form.name.errors %}<div class="form-help" style="color: var(--danger);">{{ form.name.errors.0 }}</div>{% endif %}
            </div>
            <div class="form-group">
                <label class="form-label">Description (Optional)</label>
                {{ form.description }}
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; border-top: 1px solid var(--border-light); padding-top: 1.25rem;">
                <a href="{% url 'inventory:category_list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Category</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
