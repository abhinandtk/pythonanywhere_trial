{% extends 'base.html' %}
{% block title %}Delete Customer - {{ customer.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 3rem auto;">
    <div class="card-header">
        <h2 class="card-title" style="color: var(--danger);">Delete Customer</h2>
    </div>
    <div class="card-body">
        <p style="margin-bottom: 1rem;">
            Are you sure you want to delete customer <strong>"{{ customer.name }}"</strong>?
        </p>
        <form method="post" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
            {% csrf_token %}
            <a href="{% url 'billing:customer_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
    </div>
</div>
{% endblock %}
